<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMI Calculator</title>
  <link rel="stylesheet" href="projectz.css" />
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">₦</div>
      <h1>Loan <span>EMI</span> Calculator</h1>
      <p>Calculate your monthly installments instantly</p>
    </div>

    <div class="card">
      <div class="input-group">
        <label for="principal">Loan Amount (₦)</label>
        <input type="number" id="principal" placeholder="e.g. 500000" min="0" />
      </div>

      <div class="input-group">
        <label for="rate">Annual Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="e.g. 12" min="0" step="0.1" />
      </div>

      <div class="input-group">
        <label for="tenure">Loan Tenure (Months)</label>
        <input type="number" id="tenure" placeholder="e.g. 24" min="1" />
      </div>

      <button onclick="calculate()">Calculate EMI</button>
    </div>

    <div class="results" id="results">
      <div class="result-box">
        <span class="result-label">Monthly EMI</span>
        <span class="result-value" id="emi">—</span>
      </div>
      <div class="result-box">
        <span class="result-label">Total Payment</span>
        <span class="result-value" id="total">—</span>
      </div>
      <div class="result-box">
        <span class="result-label">Total Interest</span>
        <span class="result-value" id="interest">—</span>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap" style="display:none">
      <h2>Amortization Schedule</h2>
      <table>
        <thead>
          <tr>
            <th>Month</th>
            <th>EMI</th>
            <th>Principal</th>
            <th>Interest</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>
    </div>
  </div>

  <script src="projectz.js"></script>
</body>
</html>
